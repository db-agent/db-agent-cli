[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "db-agent"
version = "0.2.0"
description = "Read-only DBA toolkit CLI: SQL Server 2016/2017 upgrade and SSRS to Power BI inventory, Databricks workspace health and DBU cost checks."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "dba", "sql-server", "ssrs", "power-bi", "sql-server-upgrade", "database-migration", "migration-assessment",
  "azure-sql", "databricks", "unity-catalog", "dbu-cost", "end-of-life", "database-inventory", "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
  "pymssql>=2.3",
  "sqlglot>=25",
  "lxml>=5",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "jinja2>=3.1",
  "pyyaml>=6",
  "databricks-sdk>=0.40",
]

[project.urls]
Homepage = "https://github.com/db-agent/db-agent-cli"
Documentation = "https://github.com/db-agent/db-agent-cli/tree/main/docs"
Issues = "https://github.com/db-agent/db-agent-cli/issues"
"Text-to-SQL agent" = "https://github.com/db-agent/db-agent"
"Fixed-price help" = "https://becloudready.com/sql-server"

[project.optional-dependencies]
odbc = ["pyodbc>=5"]
dev = ["pytest>=8"]

[project.scripts]
db-agent = "db_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/db_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live SQL Server (set DBAGENT_TEST_SERVER)"]
