[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-agent"
version = "0.2.0"
description = "db-agent: read-only DBA toolkit. One CLI, one verb set per database engine. Today: SQL Server and SSRS inventory and migration risk."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "typer>=0.12",
  "pymssql>=2.3",
  "sqlglot>=25",
  "lxml>=5",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "jinja2>=3.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
odbc = ["pyodbc>=5"]
dev = ["pytest>=8"]

[project.scripts]
db-agent = "dbagent.cli:app"
# kept so existing scripts keep working
db-agent-sqlserver = "dbagent.engines.sqlserver.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dbagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live SQL Server (set DBAGENT_TEST_SERVER)"]
