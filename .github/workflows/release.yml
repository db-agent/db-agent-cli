name: release
# Publishes to PyPI with Trusted Publishing (OIDC): no API token is stored anywhere.
# One-time setup on pypi.org: Your projects > Publishing > add a (pending) publisher with project name db-agent-kit,
#   owner/repo = db-agent/db-agent-cli, workflow = release.yml, environment = pypi
# For the TestPyPI dry run, do the same on test.pypi.org with environment = testpypi.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          INIT=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/db_agent/__init__.py').read_text()).group(1))")
          TOML=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$INIT" = "$TOML" ] || { echo "__init__ $INIT != pyproject $TOML"; exit 1; }
          [ "v$TOML" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version v$TOML"; exit 1; }
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Only db_agent is installed, and no keys or output files are shipped
        run: |
          unzip -l dist/*.whl | awk '{print $4}' | grep -E '^[a-z_]+/' | cut -d/ -f1 | sort -u | grep -vE '^(db_agent|db_agent_kit-.*\.dist-info)$' && { echo "unexpected top-level in wheel"; exit 1; } || true
          ! (unzip -l dist/*.whl; tar tzf dist/*.tar.gz) | grep -E '\.(pem|env|xlsx)$|(^|/)\.env|-output/'
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/smoke && /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/db-agent engines
          /tmp/smoke/bin/db-agent sqlserver --help
          /tmp/smoke/bin/db-agent databricks --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/db-agent-kit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/db-agent-kit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
